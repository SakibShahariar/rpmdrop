name: Fedora RPM build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install RPM build dependencies
        run: |
          dnf install -y git rpm-build python3-devel python3-setuptools \
            pyproject-rpm-macros desktop-file-utils python3-pytest python3-ruff \
            gtk4 libadwaita python3-gobject python3-dbus dnf5daemon-server dbus-daemon xorg-x11-server-Xvfb

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare RPM build tree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar.gz --prefix=rpmdrop-0.1.0/ HEAD \
            > "$HOME/rpmbuild/SOURCES/v0.1.0.tar.gz"
          cp packaging/rpmdrop.spec "$HOME/rpmbuild/SPECS/"

      - name: Build Fedora RPM
        run: |
          rpmbuild -ba "$HOME/rpmbuild/SPECS/rpmdrop.spec" \
            --define "_topdir $HOME/rpmbuild"

      - name: Run tests and lint in Fedora
        run: |
          python3 -m pytest -q
          ruff check .

      - name: Build a local DNF5 resolver fixture
        run: |
          cat > /tmp/rpmdrop-dbus-smoke.spec <<'EOF'
          Name: rpmdrop-dbus-smoke
          Version: 1.0
          Release: 1%{?dist}
          Summary: Minimal RPM used for RpmDrop DNF5 integration testing
          License: MIT
          BuildArch: noarch
          %description
          Minimal package used only to test safe DNF5 transaction resolution.
          %prep
          %build
          %install
          mkdir -p %{buildroot}%{_datadir}/doc/rpmdrop-dbus-smoke
          echo smoke > %{buildroot}%{_datadir}/doc/rpmdrop-dbus-smoke/marker
          %files
          %{_datadir}/doc/rpmdrop-dbus-smoke/marker
          EOF
          rpmbuild -bb /tmp/rpmdrop-dbus-smoke.spec --define "_topdir $HOME/rpmbuild"

      - name: Resolve a local RPM through the live DNF5 daemon
        run: |
          mkdir -p /run/dbus
          if [ ! -S /run/dbus/system_bus_socket ]; then
            dbus-daemon --system --fork --nopidfile
          fi
          dnf5daemon-server >/tmp/dnf5daemon-server.log 2>&1 &
          daemon_pid=$!
          for attempt in $(seq 1 20); do
            if busctl --system list | grep -q "org.rpm.dnf.v0"; then
              break
            fi
            sleep 0.5
          done
          if ! busctl --system list | grep -q "org.rpm.dnf.v0"; then
            cat /tmp/dnf5daemon-server.log
            exit 1
          fi
          smoke_rpm=$(find "$HOME/rpmbuild/RPMS/noarch" -name "rpmdrop-dbus-smoke-1.0-1*.noarch.rpm" -print -quit)
          test -n "$smoke_rpm"
          PYTHONPATH=src python3 tests/dnf5_integration.py "$smoke_rpm"
          kill "$daemon_pid" || true

      - name: Smoke-test GTK application startup
        run: |
          set +e
          PYTHONPATH=src timeout 10s xvfb-run -a dbus-run-session -- python3 -m rpmdrop
          app_status=$?
          set -e
          test "$app_status" -eq 124
          PYTHONPATH=src xvfb-run -a dbus-run-session -- python3 tests/gtk_smoke.py

      - name: Verify RPM artifact
        run: |
          rpm_file=$(find "$HOME/rpmbuild/RPMS/noarch" -name "rpmdrop-0.1.0-1*.noarch.rpm" -print -quit)
          test -n "$rpm_file"
          rpm -qpl "$rpm_file"
          dnf install -y "$rpm_file"
          rpm -q rpmdrop
          command -v rpmdrop
          test -f /usr/share/applications/io.github.sakibshahariar.RpmDrop.desktop
          test -f /usr/share/nautilus-python/extensions/nautilus-rpmdrop.py
          python3 tests/nautilus_smoke.py
          dnf remove -y rpmdrop
          ! rpm -q rpmdrop
          test ! -e /usr/bin/rpmdrop
          test ! -e /usr/share/applications/io.github.sakibshahariar.RpmDrop.desktop
          test ! -e /usr/share/nautilus-python/extensions/nautilus-rpmdrop.py
